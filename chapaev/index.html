<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Chapayev Checkers</title>
    <!-- Google Fonts: Display + Body -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Russo+One&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --sai-top: env(safe-area-inset-top, 0px);
        --sai-right: env(safe-area-inset-right, 0px);
        --sai-bottom: env(safe-area-inset-bottom, 0px);
        --sai-left: env(safe-area-inset-left, 0px);
      }
      html, body {
        width: 100vw;
        height: 100dvh;
        overflow: hidden;
        background: #2b1d0e;
        overscroll-behavior: none;
        touch-action: none;
      }
      #app {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="ui-root"></div>
    <!--
      Synchronous Telegram pre-bootstrap: runs before the ESM module graph
      loads so that expand() + disableVerticalSwipes() take effect immediately,
      preventing the "compact-mode flash" that would occur if we waited for the
      dynamic import of TelegramAdapter to resolve.
    -->
    <script>
      (function () {
        var tg = window.Telegram && window.Telegram.WebApp;
        if (!tg) return;
        try { tg.expand(); } catch (_) {}
        try { if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (_) {}
        try { tg.isClosingConfirmationEnabled = true; } catch (_) {}
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
