name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check package versions
        run: pnpm version:check

      - name: Build @phalanx-engine packages
        run: pnpm --filter "@phalanx-engine/*" build

      - name: Determinism lint
        run: pnpm lint:determinism

      - name: Layer rules
        run: pnpm lint:layers && pnpm test:layers

      - name: Isomorphic runtime
        run: pnpm check:isomorphic

      - name: No work on import
        run: pnpm check:side-effects

      - name: Test @phalanx-engine packages
        run: pnpm --filter "@phalanx-engine/*" test

      - name: Lands smoke
        run: pnpm smoke:lands
