<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1a1a2e" />
    <title>Abilities Playground — 1v1</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Arial,
          sans-serif;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }

      #lobby {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        color: white;
        padding: 20px;
        text-align: center;
      }

      #lobby h1 {
        font-size: clamp(1.5rem, 5vw, 2.2rem);
        margin-bottom: 0.5rem;
        color: #4ecca3;
      }

      #lobby p.subtitle {
        font-size: 1rem;
        color: #888;
        margin-bottom: 1.25rem;
      }

      #lobby p.hint {
        max-width: 28rem;
        margin: 0 auto 1.75rem;
        font-size: 0.95rem;
        line-height: 1.45;
        color: #aaa;
      }

      #find-match-btn {
        padding: 0.875rem 2rem;
        font-size: 1rem;
        background: #4ecca3;
        border: none;
        border-radius: 8px;
        color: #1a1a2e;
        cursor: pointer;
        font-weight: bold;
        min-height: 44px;
        min-width: 44px;
        transition:
          background 0.2s,
          transform 0.1s;
      }

      #find-match-btn:hover:not(:disabled) {
        background: #3ba882;
      }

      #find-match-btn:disabled {
        background: #555;
        cursor: not-allowed;
      }

      #status {
        margin-top: 1.25rem;
        font-size: 1rem;
        color: #ccc;
        min-height: 1.5em;
      }

      #game-container {
        display: none;
        width: 100%;
        height: 100%;
        position: relative;
        background: #0f0f1a;
      }

      #app {
        width: 100%;
        height: 100%;
        display: block;
      }

      /* Bottom panel so frozen winner units stay visible for balance review. */
      #result-overlay {
        display: none;
        position: absolute;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        z-index: 20;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 0.75rem;
        background: rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(4px);
        color: white;
        text-align: center;
        padding: 16px 24px;
        border-radius: 12px;
      }

      #result-overlay.visible {
        display: flex;
      }

      #result-overlay h2 {
        font-size: clamp(1.4rem, 4vw, 2rem);
        font-weight: 800;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
        margin: 0;
      }

      #result-overlay.victory h2 {
        color: #4ecca3;
      }

      #result-overlay.defeat h2 {
        color: #e74c3c;
      }

      #result-overlay .result-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
      }

      #reset-arena-btn {
        padding: 0.75rem 1.5rem;
        font-size: 1rem;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        background: #4ecca3;
        color: #1a1a2e;
        cursor: pointer;
        min-height: 44px;
      }

      #reset-arena-btn:hover {
        background: #3ba882;
      }

      #result-overlay button.secondary {
        padding: 0.75rem 1.5rem;
        font-size: 1rem;
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.08);
        color: white;
        cursor: pointer;
        min-height: 44px;
      }

      #result-overlay button.secondary:hover {
        background: rgba(255, 255, 255, 0.16);
      }

      #deployment-controls {
        display: none;
        position: absolute;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        z-index: 30;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 12px;
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(4px);
      }

      #deployment-controls.visible {
        display: flex;
      }

      #ready-btn {
        padding: 0.75rem 2rem;
        font-size: 1rem;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        background: #4ecca3;
        color: #1a1a2e;
        cursor: pointer;
        min-height: 44px;
        min-width: 140px;
      }

      #ready-btn:hover:not(:disabled) {
        background: #3ba882;
      }

      #ready-btn:disabled {
        background: #555;
        cursor: not-allowed;
      }

      #deployment-status {
        font-size: 0.9rem;
        color: #ccc;
        min-height: 1.5em;
        text-align: center;
      }

      #unit-palette {
        display: flex;
        gap: 10px;
      }

      #unit-palette button {
        padding: 0.625rem 1rem;
        font-size: 0.9rem;
        font-weight: 600;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.1);
        color: white;
        cursor: pointer;
        min-height: 44px;
        min-width: 72px;
        touch-action: none;
      }

      #unit-palette button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      #unit-palette button:hover:not(:disabled):not(.selected) {
        background: rgba(255, 255, 255, 0.16);
      }

      #unit-palette button:active:not(:disabled):not(.selected) {
        background: rgba(255, 255, 255, 0.2);
      }

      #unit-palette button.selected {
        background: #4ecca3;
        border-color: #4ecca3;
        color: #1a1a2e;
        box-shadow: 0 0 0 2px rgba(78, 204, 163, 0.45);
      }

      .loader-overlay {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #1a1a2e;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
      }

      .loader-overlay--visible {
        opacity: 1;
        pointer-events: auto;
      }

      .loader-spinner {
        width: 48px;
        height: 48px;
        border: 3px solid rgba(78, 204, 163, 0.2);
        border-top-color: #4ecca3;
        border-radius: 50%;
        animation: loader-spin 0.9s linear infinite;
      }

      .loader-label {
        font-size: 1rem;
        color: #4ecca3;
        letter-spacing: 0.04em;
      }

      @keyframes loader-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 768px) {
        #find-match-btn {
          font-size: 16px;
        }

        #deployment-controls {
          bottom: 8px;
          gap: 6px;
          padding: 8px;
        }

        #ready-btn {
          min-width: 120px;
          padding: 0.625rem 1.5rem;
        }

        #unit-palette {
          gap: 6px;
        }

        #unit-palette button {
          padding: 0.5rem 0.75rem;
          font-size: 0.8rem;
          min-width: 60px;
        }
      }
    </style>
  </head>
  <body>
    <div id="lobby">
      <h1>Abilities Playground</h1>
      <p class="subtitle">1v1 deterministic combat demo</p>
      <p class="hint">
        To preview, open this page in two browser tabs, then click
        <strong>Find Match</strong> in each. The game will start for both
        players.
      </p>
      <button id="find-match-btn" type="button">Find Match</button>
      <div id="status"></div>
    </div>

    <div id="game-container">
      <canvas id="app"></canvas>

      <div id="deployment-controls" class="visible">
        <button id="ready-btn" type="button">READY</button>
        <p id="deployment-status"></p>
        <div id="unit-palette">
          <button id="unit-btn-sphere" type="button" data-unit-type="sphere">
            Sphere
          </button>
          <button id="unit-btn-cube" type="button" data-unit-type="cube">
            Cube
          </button>
          <button id="unit-btn-support" type="button" data-unit-type="support">
            Support
          </button>
          <button id="unit-btn-rocket" type="button" data-unit-type="rocket">
            Rocket
          </button>
          <button id="unit-btn-volt" type="button" data-unit-type="volt">
            Volt
          </button>
          <button id="unit-btn-plasma-tank" type="button" data-unit-type="plasmaTank">
            Plasma Tank
          </button>
          <button id="unit-btn-sau" type="button" data-unit-type="sau">
            SAU
          </button>
        </div>
      </div>

      <div id="result-overlay">
        <h2 id="result-title">Victory</h2>
        <div class="result-actions">
          <button id="reset-arena-btn" type="button" hidden>
            Reset Arena
          </button>
          <button id="return-lobby-btn" class="secondary" type="button">
            Return to Lobby
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
